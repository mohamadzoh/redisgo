name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  REDIS_URL: redis://127.0.0.1:6379/

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  msrv:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.85"
    # yoke-derive 0.8.3 needs Rust 1.87 but declares no rust-version, so the
    # MSRV-aware resolver cannot skip it. Dev-dependencies (criterion) need a
    # newer toolchain, so only the library is built here.
    - name: Resolve dependencies
      run: |
        cargo generate-lockfile
        cargo update -p yoke-derive --precise 0.8.2
    - name: Build
      run: cargo build --locked --verbose
